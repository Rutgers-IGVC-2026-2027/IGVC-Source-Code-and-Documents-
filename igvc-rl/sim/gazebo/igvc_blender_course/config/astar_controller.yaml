astar_controller:
  ros__parameters:
    use_sim_time: true
    pose_topic: /ground_truth/odom
    cmd_vel_topic: /cmd_vel
    world_frame: world
    control_rate: 20.0
    pose_timeout: 1.0
    max_speed: 0.6
    lookahead: 0.9
    resolution: 0.05
    safety_margin: 0.10
    goal_tolerance: 0.20
    goal_stop_speed: 0.05
    max_tracking_error: 0.5
